apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: ci-demo}
  template:
    metadata:
      labels: {app: ci-demo}
    spec:
      containers:
        - name: ci-demo
          image: ghcr.io/<github-username>/ci-demo:latest
          ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: ci-demo
spec:
  type: LoadBalancer
  selector: {app: ci-demo}
  ports: [{port: 80, targetPort: 5000}]
