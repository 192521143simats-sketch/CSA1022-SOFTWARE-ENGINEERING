<!DOCTYPE html><html><head><meta charset="utf-8"><title>Notes - 3 tier app</title>
<style>body{font-family:Segoe UI,Arial;background:#f8fafc;margin:0}.b{max-width:600px;margin:50px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 24px #0001}
input{padding:10px;width:70%;border:1px solid #cbd5e1;border-radius:8px}button{padding:10px 16px;background:#7c3aed;color:#fff;border:0;border-radius:8px}
li{padding:8px 0;border-bottom:1px solid #eee}small{color:#64748b}</style></head><body><div class="b">
<h1>Notes</h1><small>frontend (Nginx) &rarr; backend (Flask) &rarr; database (PostgreSQL)</small><p>
<input id="t" placeholder="Write a note"><button onclick="add()">Save</button></p><ul id="l"></ul></div>
<script>
async function load(){const r=await fetch('/api/notes');const n=await r.json();document.getElementById('l').innerHTML=n.map(x=>'<li>'+x+'</li>').join('')}
async function add(){const t=document.getElementById('t');await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})});t.value='';load()}
load()
</script></body></html>
